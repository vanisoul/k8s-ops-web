services:
  k8s-ops-web:
    build:
      context: .
      args:
        VERSION: "1.0.0"
    image: k8s-ops-web:1.0.0
    container_name: k8s-ops-web
    ports:
      - "3000:3000"
    environment:
      - NAMESPACE=${NAMESPACE:?Set NAMESPACE to the target Kubernetes namespace}
      - DEPLOYMENT=${DEPLOYMENT:?Set DEPLOYMENT to the target Deployment name}
      - PORT=3000
      - KUBECONFIG=/root/.kube/config
    volumes:
      - ${KUBECONFIG:-~/.kube/config}:/root/.kube/config:ro
    restart: unless-stopped
